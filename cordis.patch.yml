# ============================================================================
# dsh-music-player —— 插件自带的挂载声明（bundle patch）
# ============================================================================
# 这个文件是**包的一部分**：装进 profile 的 `dsh.profile.bundles` 后，启动时按
#   「bundle 顺序 → profile 自己的 cordis.patch.yml → --patch」
# 叠进插件树。
#
# ⭐ 入口（insert）写在这里，是为了**卸载干净**：插件管理器卸载时只清
#   「包自带 patch 里的行」，绝不改写用户的 cordis.patch.yml。
#   ⇒ 别把这段抄进 profile 的 patch 里（重复 insert 会让卸载 409 拒绝）。
#
# 播放器全在浏览器半端（client.js）：左侧栏图标 + 主工作区面板；Host 半端
# 不注册工具、不挂 HTTP 接口（本机文件用浏览器 File API 读，零联网）。
# 装/卸：见 README.md。
# ============================================================================

- insert:
    - id: music-player
      name: dsh-music-player
